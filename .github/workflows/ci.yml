name: verify-character-slice

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: paper-doll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install character asset tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
      - run: npm run assets:check
      - run: npm test
      - run: npm run build
      - name: Use runner Chrome for browser verification
        run: |
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome)"
          test -n "$CHROME_PATH"
          echo "CHROMIUM_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - run: npm run test:visual -- --retries=0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
